project_id = "padel-match"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Tu codigo de PadelMatch es {{ .Code }}"

# WhatsApp como canal del OTP solo funciona con el proveedor Twilio o Twilio Verify
# (se configura desde el dashboard en produccion, con un remitente de WhatsApp
# aprobado). En local se prueba con el canal "sms" y estos OTP de test:
[auth.sms.test_otp]
"5491100000000" = "123456"

[edge_runtime]
enabled = true

[functions.reminders]
verify_jwt = false
